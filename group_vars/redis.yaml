- name: configuring redis server
  hosts: redis
  become: yes
  tasks:
    name: enable redis 7
    command: dnf module enable redis:7 -y
- name: install redis
  package: 
    name: redis
    state: present
- name: allow remote connections
  replace: 
    path: /etc/redis/redis.conf 
    regex: '127.0.0.1'
    replace: '0.0.0.0'
- name: change protected module
  lineinfile:
    path: /etc/redis/redis.conf
    regex: 'protected-mode'
    line: 'protected-mode no'
- name: start and enable redis
  service: 
    name: redis
    enabled: yes
